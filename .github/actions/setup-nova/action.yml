name: Setup Nova
description: Install Nova CI toolchain

runs:
  using: composite

  steps:
    - name: Install system dependencies
      shell: bash
      run: |
        set -euo pipefail

        sudo apt-get update

        sudo apt-get install -y \
          ca-certificates \
          curl \
          gnupg \
          ninja-build \
          python3 \
          python3-venv \
          pkg-config \
          libwayland-dev \
          wayland-protocols \
          libxkbcommon-dev \
          libvulkan-dev \
          zstd

    - name: Install LLVM 22
      shell: bash
      run: |
        set -euo pipefail

        sudo install -d -m 0755 /etc/apt/keyrings

        curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
          | gpg --dearmor \
          | sudo tee /etc/apt/keyrings/llvm.gpg >/dev/null

        echo \
          "deb [signed-by=/etc/apt/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" \
          | sudo tee /etc/apt/sources.list.d/llvm-22.list

        sudo apt-get update

        sudo apt-get install -y \
          clang-22 \
          lld-22 \
          llvm-22

        sudo ln -sf /usr/bin/ld.lld-22 /usr/local/bin/ld.lld
        sudo ln -sf /usr/bin/llvm-symbolizer-22 /usr/local/bin/llvm-symbolizer

        echo "CC=/usr/bin/clang-22" >> "$GITHUB_ENV"
        echo "CXX=/usr/bin/clang++-22" >> "$GITHUB_ENV"
        echo "LLVM_SYMBOLIZER_PATH=/usr/bin/llvm-symbolizer-22" >> "$GITHUB_ENV"

    - name: Install build tools
      shell: bash
      run: |
        set -euo pipefail

        python3 -m venv "$RUNNER_TEMP/nova-python"

        "$RUNNER_TEMP/nova-python/bin/python" \
          -m pip install \
          --upgrade pip

        "$RUNNER_TEMP/nova-python/bin/python" \
          -m pip install \
          "cmake==4.4.3" \
          "conan==2.32.0"

        echo "$RUNNER_TEMP/nova-python/bin" >> "$GITHUB_PATH"

    - name: Configure Conan
      shell: bash
      run: |
        set -euo pipefail

        CC=/usr/bin/clang-22 \
        CXX=/usr/bin/clang++-22 \
          conan profile detect --force